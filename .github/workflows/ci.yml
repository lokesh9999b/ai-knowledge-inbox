name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Builds the real images and exercises the running stack through the nginx proxy, exactly as a user would.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test through the web proxy
        run: |
          set -euo pipefail
          base=http://localhost:8080
          curl -fsS "$base/" | grep -q "AI Knowledge Inbox"
          curl -fsS "$base/api/health"
          echo
          curl -fsS -X POST "$base/api/ingest" -H 'content-type: application/json' \
            -d '{"type":"note","title":"Coffee","content":"Espresso is brewed by forcing hot water at about 9 bars of pressure through finely ground coffee."}'
          echo
          for i in $(seq 1 60); do
            status=$(curl -fsS "$base/api/items?limit=1" | jq -r '.items[0].status')
            [ "$status" = "ready" ] && break
            sleep 1
          done
          echo "item status: $status"
          [ "$status" = "ready" ]
          curl -fsS -X POST "$base/api/query" -H 'content-type: application/json' \
            -d '{"question":"How much pressure does a coffee machine use?"}' | tee /tmp/answer.json
          echo
          jq -e '(.sources | length) >= 1 and (.answer | length) > 0' /tmp/answer.json
      - name: Data survives a restart (named volume)
        run: |
          set -euo pipefail
          docker compose restart api
          docker compose up -d --wait --wait-timeout 120
          test "$(curl -fsS http://localhost:8080/api/items | jq '.total')" = "1"
      - name: Image sizes
        if: always()
        run: docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'api|web' || true
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v
